apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: veecode-platform-plugin-aws-cost-insights
  namespace: veecode
  title: "AWS Cost Insights"
  links:
    - url: https://github.com/veecode-platform/devportal-plugins
      title: Source Repository
  annotations:
    backstage.io/source-location: url:https://github.com/veecode-platform/devportal-plugins/tree/main/workspaces/aws-cost-insights
  tags: []
spec:
  packageName: "@veecode-platform/plugin-aws-cost-insights"
  # Tag: bs_1.54.9__0.3.0
  dynamicArtifact: "oci://quay.io/veecode/veecode-platform-plugin-aws-cost-insights@sha256:c6d8d7f41213dfdc99e1e77a10b0b64c426dd0415355b95f07cbf2a9dd22b8b7"
  version: 0.3.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.9
  author: VeeCode
  support: community
  lifecycle: active
  partOf:
    - aws-cost-insights
  appConfigExamples:
    - title: Default configuration
      content:
        # Required by the cost-insights frontend schema; without it the portal
        # rejects the frontend config and every route returns 503. Same value as
        # the backend package's example.
        costInsights:
          engineerCost: 200000
        dynamicPlugins:
          frontend:
            veecode-platform.plugin-aws-cost-insights:
              appIcons:
                - name: costInsightsIcon
                  importName: CostInsightsIcon
              dynamicRoutes:
                - path: /cost-insights
                  importName: CostInsightsPage
                  menuItem:
                    icon: costInsightsIcon
                    text: AWS Cost Insights
              menuItems:
                cost-insights:
                  title: AWS Cost Insights
                  icon: costInsightsIcon
                  priority: 70
              entityTabs:
                - path: /costs
                  title: AWS Cost Insights
                  mountPoint: entity.page.costs
              mountPoints:
                - mountPoint: entity.page.costs/cards
                  importName: EntityCostInsightsContent
                  config:
                    layout:
                      gridColumn: "1 / -1"
                - mountPoint: entity.page.costs/cards
                  importName: EntityClusterCostCard
                  config:
                    layout:
                      gridColumn: "1 / -1"
