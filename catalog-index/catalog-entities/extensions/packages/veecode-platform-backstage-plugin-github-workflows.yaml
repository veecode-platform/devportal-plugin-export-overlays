apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: veecode-platform-backstage-plugin-github-workflows
  namespace: veecode
  title: "GitHub Workflows"
  links:
    - url: https://github.com/veecode-platform/devportal-plugins
      title: Source Repository
  annotations:
    backstage.io/source-location: url:https://github.com/veecode-platform/devportal-plugins/tree/main/workspaces/github-workflows
  tags: []
spec:
  packageName: "@veecode-platform/backstage-plugin-github-workflows"
  # Tag: bs_1.54.9__1.3.7
  dynamicArtifact: "oci://quay.io/veecode/veecode-platform-backstage-plugin-github-workflows@sha256:f38b1150e8f6734abb943c55c395e0c1082abfb85559f6db184d22d4c1ec66c4"
  nfs:
    entrypoint: ./alpha
    exposedModules:
      - .
      - alpha
    composition:
      route: /catalog/default/component/probe-github-workflows
      featureId: github-workflows.workflows-cards
      provenance:
        sources:
          - path: workspaces/github-workflows/plugins/github-workflows/src/alpha.ts
            lines: 27-32
          - path: workspaces/github-workflows/plugins/github-workflows/src/alpha/entityCards.tsx
            lines: 24-31
          - path: workspaces/github-workflows/plugins/github-workflows/src/hooks/useGithubWorkflows.ts
            lines: 4-5
          - path: workspaces/github-workflows/plugins/github-workflows/src/components/GitubWorkflowsContent/GithubWorkflowsContent.tsx
            lines: 132-135
          - path: workspaces/github-workflows/plugins/github-workflows/src/components/GitubWorkflowsContent/WorkFlowsCards/WorkFlowsCards.tsx
            lines: 38-44
      assertions:
        - type: text
          value: Workflows
  version: 1.3.7
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.9
  author: VeeCode
  support: community
  lifecycle: active
  partOf:
    - github-workflows
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            veecode-platform.backstage-plugin-github-workflows:
              mountPoints:
                - mountPoint: entity.page.overview/cards
                  importName: EntityGithubWorkflowsCard
                  config:
                    layout:
                      gridRowStart:
                        lg: "4"
                      gridColumnStart:
                        lg: "1"
                      gridColumnEnd:
                        lg: "span 6"
