      content:
        dynamicPlugins:
          frontend:
            devportal.marketplace-frontend:
              appIcons:
                - name: pluginsIcon
                  importName: PluginsIcon
              dynamicRoutes:
                - path: /marketplace
                  importName: DynamicExtensionsPluginRouter
                  menuItem:
                    icon: pluginsIcon
                    text: Marketplace
              menuItems:
                marketplace:
                  title: Marketplace
                  icon: pluginsIcon
