apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: devportal-marketplace-frontend-dynamic
  namespace: veecode
  title: "DevPortal Marketplace Frontend"
  links:
    - url: https://github.com/veecode-platform/devportal-plugins
      title: Source Repository
  annotations:
    backstage.io/source-location: url:https://github.com/veecode-platform/devportal-plugins/tree/main/workspace/marketplace
  tags: []
spec:
