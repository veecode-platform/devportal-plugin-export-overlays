 installation: |
     ## Installation

     ### Installing the MCP Actions Backend Plugin

     First, install the `MCP Actions Backend` plugin available in the marketplace, and make sure the `Kubernetes` backend plugin is installed and configured

     ### Dynamic Plugin Installation for Red Hat Developer Hub

     Add the following configuration to your dynamic plugin yaml:

     ```yaml
     includes:
       - dynamic-plugins.default.yaml
     plugins:
       # MCP server backend plugin
       - package: oci://quay.io/veecode/mcp-integrations:bs_1.52.0!red-hat-developer-hub-backstage-plugin-kubernetes-mcp-extras
         disabled: false
     ```

     ## RHDH Configuration

     ### Complete Configuration Reference

    
     Register the MCP tool as a plugin source in your App Config:

     ```yaml
     backend:
       actions:
         pluginSources:
           - kubernetes-mcp-extras
     ```
