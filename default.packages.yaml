# GENERATED (initial import, WS-2a / ADR-008) from workspaces/*/metadata/*.yaml.
# Format matches upstream RHDH's default.packages.yaml (scripts/update-index.sh Step 3).
#
# Lists every plugin package belonging to an ACTIVE workspace (has a
# plugins-list.yaml without the .disabled suffix -- i.e. the fleet actually
# exports and publishes it). Regenerate this list when a workspace is
# enabled/disabled or a package is added/removed from an active workspace.
#
# Everything below is intentionally listed under `disabled:` (patched into
# scripts/generateDynamicPluginsDefaultYaml.sh -- upstream's build_plugin_entry
# emits `enabled:`, this fork's DPDY consumer contract requires the literal
# `disabled: true` key, see ADR-005/ADR-006 and catalog-entities/Containerfile).
# This index only declares canonical plugin versions for {{inherit}} to
# resolve from CATALOG_INDEX_IMAGE; enabling a plugin for a given
# tenant/operator stays their job, in their own dynamic-plugins.yaml.
#
# FACE-OWNED packages are deliberately excluded (not just disabled): the
# VeeCode product face ships them baked into the devportal-core image
# (dynamic-plugins.veecode.yaml), which is their canonical version source
# (ADR-005/ADR-006 -- "face out of the index"). A same-level duplicate plugin
# key between that baked file and this DPDY is a fatal InstallException at
# RHDH 1.10 installer merge time regardless of disabled state. Excluded
# workspaces: marketplace, veecode-homepage, veecode-theme (matches the
# FACE_OWNED_IMAGES list this file replaces from the retired
# scripts/generate-dpdy-index.sh). Their Package *entities* are NOT excluded
# here -- generateCatalogIndex.py copies workspaces/*/metadata/*.yaml into
# catalog-entities/extensions/packages/ unfiltered, so the marketplace UI
# still sees them; only their DPDY membership is withheld.
#
# NOTE (open question, see PR body): vertigo-theme is structurally identical
# to veecode-theme (a tenant-specific baked theme plugin) but was NOT in the
# original FACE_OWNED_IMAGES list, so it is NOT excluded here either -- this
# preserves current behavior exactly. Flagging in case that was an oversight.
