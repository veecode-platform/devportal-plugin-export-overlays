      url: https://github.com/veecode-platform/backstage-plugins-for-aws/tree/main/plugins/cost-insights/backend
  annotations:
    backstage.io/source-location: url:https://github.com/veecode-platform/backstage-plugins-for-aws/tree/main/plugins/cost-insights/backend
  tags: []
spec:
