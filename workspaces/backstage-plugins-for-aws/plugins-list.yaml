plugins/ecs/frontend:
plugins/ecs/backend: --embed-package @aws/aws-core-plugin-for-backstage-common --embed-package @aws/aws-core-plugin-for-backstage-node
plugins/codebuild/frontend:
plugins/codebuild/backend: --embed-package @aws/aws-core-plugin-for-backstage-common --embed-package @aws/aws-core-plugin-for-backstage-node
plugins/codepipeline/frontend:
plugins/codepipeline/backend: --embed-package @aws/aws-core-plugin-for-backstage-common --embed-package @aws/aws-core-plugin-for-backstage-node
# The trailing --shared-package NEGATION is load-bearing (gotcha
# plugin-dinamico-rhdh-peer-nao-empacotado, fixed 2026-08-13, REGRESSED on the
# 2026-08-20 migration to this fleet and took staging down): the CLI's
# -common/-node auto-embed is family-scoped, so @backstage/plugin-kubernetes-common
# (cross-family hard dep of the AWS module's AwsEKSClusterProcessor) is demoted
# to a peer the host does NOT provide — the bundle installs fine and dies at
# load with MODULE_NOT_FOUND. Export flags are part of the artifact's contract:
# never port this line without them.
plugins/core/catalog-aws-s3: --embed-package @backstage/plugin-catalog-backend-module-aws --shared-package '!@backstage/plugin-kubernetes-common'
