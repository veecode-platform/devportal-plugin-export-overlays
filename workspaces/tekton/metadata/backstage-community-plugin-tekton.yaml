apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-tekton
  namespace: rhdh
  title: Tekton
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/tekton
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/tekton
  tags: []
spec:
  packageName: '@backstage-community/plugin-tekton'
  dynamicArtifact: oci://quay.io/veecode/tekton:bs_1.54.0-next.0!backstage-community-plugin-tekton
  nfs:
    entrypoint: ./alpha
    exposedModules:
      - .
      - alpha
    composition:
      route: /catalog/default/component/probe-tekton
      featureId: tekton.tektonEntityContent
      probe:
        kind: Component
        annotations:
          janus-idp.io/tekton: __nfs_annotation_present__
      provenance:
        sources:
          - path: workspaces/tekton/plugins/tekton/src/alpha.tsx
            lines: 32-35
          - path: workspaces/tekton/plugins/tekton/src/alpha.tsx
            lines: 19-26
          - path: workspaces/tekton/plugins/tekton/src/components/Router.tsx
            lines: 1-34
          - path: workspaces/tekton/plugins/tekton/src/components/common/TableExpandCollapse.tsx
            lines: 46-46
          - path: workspaces/tekton/plugins/tekton/src/utils/isTektonCIAvailable.ts
            lines: 33-35
          - path: workspaces/tekton/plugins/tekton/src/utils/isTektonCIAvailable.ts
            lines: 20-20
        siblingPackages:
          - type: workspace-package
            packageName: '@backstage-community/plugin-tekton-common'
            packageRoot: /home/gio/drydock-rescue/author-source-cache/64fbef085e46ed74d30f/workspaces/tekton/plugins/tekton-common
            subpath: .
            entrypoint: src/index.ts
          - type: workspace-package
            packageName: '@backstage-community/plugin-tekton-react'
            packageRoot: /home/gio/drydock-rescue/author-source-cache/64fbef085e46ed74d30f/workspaces/tekton/plugins/tekton-react
            subpath: .
            entrypoint: src/index.ts
        annotationDecisions:
          - janus-idp.io/tekton: assertion
      assertions:
        - type: text
          value: Collapse all
          proofLevel: content
      surfacePath: /tekton
  version: 3.37.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.49.4
  author: Red Hat
  support: community
  lifecycle: active
  partOf:
    - tekton
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-tekton:
              translationResources:
                - importName: tektonTranslations
                  ref: tektonTranslationRef
              mountPoints:
                - mountPoint: entity.page.ci/cards
                  importName: TektonCI
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      allOf:
                        - isTektonCIAvailable
