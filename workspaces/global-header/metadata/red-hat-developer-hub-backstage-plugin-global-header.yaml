apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: red-hat-developer-hub-backstage-plugin-global-header
  namespace: rhdh
  title: Global Header
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://issues.redhat.com/browse/RHDHBUGS
      title: "Report issues here. Note: Customers of Red Hat Developer Hub should raise a Red Hat support case instead."
    - title: Source Code
      url: https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/global-header
  annotations:
    backstage.io/source-location: url:https://github.com/redhat-developer/rhdh-plugins/tree/main/workspaces/global-header
  tags: []
spec:
  packageName: '@red-hat-developer-hub/backstage-plugin-global-header'
  dynamicArtifact: oci://quay.io/veecode/red-hat-developer-hub-backstage-plugin-global-header:bs_1.54.9__3.1.0!red-hat-developer-hub-backstage-plugin-global-header
  version: 3.1.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.54.9
  author: Red Hat
  support: generally-available
  lifecycle: active
  partOf:
    - global-header
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            default.main-menu-items:
              menuItems:
                default.admin:
                  title: Administration
                  textKey: menuItem.administration
                  icon: admin
                default.learning-path:
                  enabled: false
                default.home:
                  priority: 100
                default.catalog:
                  priority: 96
                default.apis:
                  priority: 92
                default.docs:
                  title: Docs
                  icon: docs
                  to: docs
                  priority: 88
                default.create:
                  priority: 84
            red-hat-developer-hub.backstage-plugin-global-header:
              translationResources:
                - importName: globalHeaderTranslations
                  ref: globalHeaderTranslationRef
              mountPoints:
                - mountPoint: application/header
                  importName: GlobalHeader
                  config:
                    position: above-main-content
                - mountPoint: global.header/component
                  importName: SearchComponent
                  config:
                    priority: 100
                - mountPoint: global.header/component
                  importName: Spacer
                  config:
                    priority: 99
                    props:
                      growFactor: 0
                - mountPoint: global.header/component
                  importName: HeaderIconButton
                  config:
                    priority: 90
                    props:
                      title: Self-service
                      titleKey: create.title
                      icon: add
                      to: create
                - mountPoint: global.header/component
                  importName: StarredDropdown
                  config:
                    priority: 85
                - mountPoint: global.header/component
                  importName: ApplicationLauncherDropdown
                  config:
                    priority: 82
                - mountPoint: global.header/component
                  importName: HelpDropdown
                  config:
                    priority: 80
                - mountPoint: global.header/help
                  importName: SupportButton
                  config:
                    priority: 10
                - mountPoint: global.header/component
                  importName: NotificationButton
                  config:
                    priority: 70
                - mountPoint: global.header/component
                  importName: Divider
                  config:
                    priority: 50
                - mountPoint: global.header/component
                  importName: ProfileDropdown
                  config:
                    priority: 10
                - mountPoint: global.header/profile
                  importName: MenuItemLink
                  config:
                    priority: 100
                    props:
                      title: Settings
                      titleKey: profile.settings
                      link: /settings
                      icon: manageAccounts
                - mountPoint: global.header/profile
                  importName: MenuItemLink
                  config:
                    priority: 90
                    props:
                      title: My profile
                      titleKey: profile.myProfile
                      type: myProfile
                      icon: account
                - mountPoint: global.header/profile
                  importName: LogoutButton
                  config:
                    priority: 10
