# Curated allowlist. This file is the export selector: the workspace source is
# cloned from source.json regardless of what is listed here, and only the
# uncommented entries below are built and pushed into the OCI bundle. Commenting
# an entry out costs nothing and removes nothing from upstream — it just skips
# the export.
#
# Adoption criterion — an entry stays enabled only if at least one holds:
#   (a) it has a workspaces/backstage/metadata/*.yaml, so it reaches the
#       Extensions catalog index and is discoverable in the UI; or
#   (b) some consumer config references its OCI ref — devportal-platform
#       (dynamic-plugins.default.yaml, presets/*), devportal-distro or
#       devportal-samples.
#
# Everything else is commented out below, grouped as upstream groups it, so
# re-adopting a package is a one-line change. Upstream additions are never
# enrolled automatically; each new package needs a separate adoption decision.
#
# Why this matters: the export step costs ~28s per entry and is ~80% of this
# job's wall clock. At 39 entries this workspace took 22-23 min, 2.5x the next
# slowest in the fleet, on every publish.
#
# Removed (static in devportal-base):
#   auth: github, gitlab, google, microsoft, oidc, gcp-iap, oauth2-proxy
#   catalog: azure, github, github-org, gitlab, gitlab-org, ldap, msgraph
#   scaffolder: azure, github, gitlab, notifications
#   search: techdocs
#   other: home, kubernetes-backend, notifications, notifications-backend,
#          org, proxy-backend, signals, signals-backend, techdocs,
#          techdocs-backend, techdocs-module-addons-contrib,
#          events-backend-module-github
#
# Removed (wrapped in devportal-distro):
#   catalog: bitbucket-cloud, bitbucket-server
#   scaffolder: bitbucket-cloud, bitbucket-server
#
# Removed while moving the source from 1.49.4 to 1.53.0:
#   scaffolder-backend-module-bitbucket: path no longer exists upstream
#   example-todo-list/backend: private internal examples, not product plugins

# ============================================================================
# Enabled — exported into the bundle
# ============================================================================

# Consumed by devportal-platform (dynamic-plugins.default.yaml,
# presets/kubernetes.yaml), devportal-distro and devportal-samples.
# Adopted deliberately in #11 so the platform can consume it via OCI ref.
plugins/kubernetes:

# Consumed by devportal-platform (dynamic-plugins.default.yaml, presets/mcp.yaml
# and presets/mcp-chat.yaml) and covered by every patch in this workspace.
plugins/mcp-actions-backend:

# Upstream Backstage's OAuth consent page (frontend): mounts /oauth2/authorize/
# :sessionId via its Router — the page every external MCP client lands on during
# the DCR authorization flow. Required by any RHDH-shell consumer of
# mcp-actions-backend (the fork/tenant shells have no baked consent route, unlike
# devportal-base's app). Overlay scalprum-config.json synced from upstream #2498;
# upstream exports it too (ghcr bs_1.52.0__0.1.9). Wiring: dynamicRoutes
# path /oauth2/* -> importName Router (see metadata appConfigExamples).
plugins/auth:

# Catalogued: each has a metadata/*.yaml and a published Plugin entity.
plugins/events-backend-module-gitlab:
plugins/scaffolder-backend-module-gerrit:
plugins/notifications-backend-module-email: --embed-package @backstage/plugin-notifications-node

# ============================================================================
