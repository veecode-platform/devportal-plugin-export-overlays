apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-npm
  namespace: rhdh
  title: NPM
  links:
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/npm
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/npm
  tags: []
spec:
  nfs:
    entrypoint: ./alpha
    exposedModules:
      - .
      - alpha
    composition:
      route: /catalog/default/component/probe-npm
      featureId: npm.EntityNpmInfoCard
      probe:
        kind: Component
        annotations:
          npm/package: '@backstage/catalog-model'
      provenance:
        sources:
          - path: workspaces/npm/plugins/npm/src/alpha.tsx
            lines: 116-124
          - path: workspaces/npm/plugins/npm/src/alpha.tsx
            lines: 63-72
          - path: workspaces/npm/plugins/npm/src/components/EntityNpmInfoCard.tsx
            lines: 1-251
          - path: workspaces/npm/plugins/npm/src/components/EntityNpmInfoCard.tsx
            lines: 139-139
          - path: workspaces/npm/plugins/npm-common/src/utils.ts
            lines: 26-28
          - path: workspaces/npm/plugins/npm-common/src/annotations.ts
            lines: 20-20
        siblingPackages:
          - type: workspace-package
            packageName: '@backstage-community/plugin-npm-common'
            packageRoot: /home/gio/drydock-rescue/author-source-cache/0feedcc8b7acb57f4a67/workspaces/npm/plugins/npm-common
            subpath: .
            entrypoint: src/index.ts
        annotationDecisions:
          - npm/package: hint
        decidedBy: hint
      assertions:
        - type: text
          value: NPM package @backstage/catalog-model
          proofLevel: mount
    hints:
      surface: EntityNpmInfoCard
      annotations:
        npm/package: '@backstage/catalog-model'
  packageName: "@backstage-community/plugin-npm"
  dynamicArtifact: oci://quay.io/veecode/npm:bs_1.54.0-next.0!backstage-community-plugin-npm
  version: 1.20.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.49.4
  author: Backstage Community
  support: community
  lifecycle: active
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-npm:
              translationResources:
                - module: alpha
                  importName: npmTranslations
                  ref: npmTranslationRef
              entityTabs:
                - mountPoint: entity.page.npm
                  path: /npm
                  title: npm releases
                  config:
                    if:
                      allOf:
                        - isNpmAvailable
              mountPoints:
                - mountPoint: entity.page.overview/cards
                  importName: EntityNpmInfoCard
                  config:
                    layout:
                      gridColumnEnd:
                        xs: "span 12"
                        md: "span 8"
                    if:
                      allOf:
                        - isNpmAvailable
                - mountPoint: entity.page.overview/cards
                  importName: EntityNpmReleaseOverviewCard
                  config:
                    layout:
                      gridColumnEnd:
                        xs: "span 12"
                        md: "span 8"
                    if:
                      allOf:
                        - isNpmAvailable
                - mountPoint: entity.page.npm/cards
                  importName: EntityNpmReleaseTableCard
                  config:
                    layout:
                      gridColumnEnd:
                        xs: "span 12"
                    if:
                      allOf:
                        - isNpmAvailable
