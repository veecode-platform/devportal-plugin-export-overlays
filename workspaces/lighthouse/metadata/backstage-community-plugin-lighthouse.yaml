apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-lighthouse
  namespace: rhdh
  title: Lighthouse
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/lighthouse
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/lighthouse
  tags: []
spec:
  packageName: '@backstage-community/plugin-lighthouse'
  dynamicArtifact: oci://quay.io/veecode/lighthouse:bs_1.54.0-next.0!backstage-community-plugin-lighthouse
  nfs:
    entrypoint: ./alpha
    exposedModules:
      - .
      - alpha
    composition:
      route: /catalog/default/component/probe-lighthouse
      featureId: lighthouse.lighthouse
      probe:
        kind: Component
        annotations:
          lighthouse.com/website-url: https://backstage.io
      provenance:
        sources:
          - path: workspaces/lighthouse/plugins/lighthouse/src/alpha/plugin.ts
            lines: 27-35
          - path: workspaces/lighthouse/plugins/lighthouse/src/alpha/extensions.tsx
            lines: 57-66
          - path: workspaces/lighthouse/plugins/lighthouse/src/components/Cards/LastLighthouseAuditCard.tsx
            lines: 1-129
          - path: workspaces/lighthouse/plugins/lighthouse/src/components/Cards/LastLighthouseAuditCard.tsx
            lines: 125-125
          - path: workspaces/lighthouse/plugins/lighthouse/src/Router.tsx
            lines: 30-36
          - path: workspaces/lighthouse/plugins/lighthouse/constants.ts
            lines: 16-16
          - path: workspaces/lighthouse/plugins/lighthouse/dev/index.tsx
            lines: 37-37
      assertions:
        - type: text
          value: Lighthouse Audit
  version: 0.24.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.52.0
  author: Red Hat
  support: community
  lifecycle: active
  partOf:
    - lighthouse
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-lighthouse:
              appIcons:
                - name: lighthouse
                  importName: LighthouseIcon
              dynamicRoutes:
                - path: /lighthouse
                  importName: LighthousePage
                  menuItem:
                    icon: lighthouse
                    text: menuItem.lighthouse
                    textKey: menuItem.lighthouse
              mountPoints:
                - mountPoint: entity.page.overview/cards
                  importName: EntityLastLighthouseAuditCard
                  config:
                    layout:
                      gridColumnEnd:
                        md: span 6
                        xs: span 12
                    if:
                      allOf:
                        - isLighthouseAvailable
        # The frontend's configSchema requires lighthouse.baseUrl (verified
        # against the bs_1.53.0 bundle's dist-scalprum/configSchema.json);
        # without it the whole 'app' plugin fails startup schema validation.
        lighthouse:
          baseUrl: ${LIGHTHOUSE_URL}
