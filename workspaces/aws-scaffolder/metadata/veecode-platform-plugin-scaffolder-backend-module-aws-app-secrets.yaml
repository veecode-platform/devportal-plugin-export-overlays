apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  # metadata.name is capped at 63 characters (checkCatalogPackages.py). The flattened
  # package name is 65, so the name is shortened with common/scripts/shorten-component-name.sh.
  name: veecode-platform-plgn-scaffolder-backend-mod-aws-app-secrets
  # Package only, intentionally NO Plugin catalog entity and NOT listed in
  # catalog-entities/extensions/plugins/all.yaml. It is a scaffolder action module used
  # by templates, not a marketplace extension. Same pattern as vertigo-theme.
  namespace: veecode
  title: "AWS App Secrets (scaffolder module)"
  links:
    - url: https://github.com/veecode-platform/devportal-plugins
      title: Source Repository
  annotations:
    backstage.io/source-location: url:https://github.com/veecode-platform/devportal-plugins/tree/main/workspaces/aws-scaffolder/plugins/scaffolder-backend-module-aws-app-secrets
  tags: []
spec:
  packageName: "@veecode-platform/plugin-scaffolder-backend-module-aws-app-secrets"
  dynamicArtifact: oci://quay.io/veecode/veecode-platform-plugin-scaffolder-backend-module-aws-app-secrets:bs_1.54.9__0.2.0
  version: 0.2.0
  appConfigExamples:
    - title: Default configuration
      content:
        # The module reads appSecrets once at start and refuses to start on a missing or
        # invalid value. Replace the example ARN and cluster with the tenant's own values.
        appSecrets:
          region: us-east-1
          writerRoleArn: arn:aws:iam::123456789012:role/example-secret-writer
          pathPattern: /{cluster}/apps/{app}/{environment}/{name}
          cluster: example-cluster
          environments:
            - dev
          declarationFile: config/{environment}.yaml
          reservedNames:
            - PORT
            - OTEL_SERVICE_NAME
          reservedPrefixes:
            - OTEL_
  backstage:
    role: backend-plugin-module
    supportedVersions: 1.54.9
  author: VeeCode
  support: community
  lifecycle: active
  partOf:
    - aws-scaffolder
