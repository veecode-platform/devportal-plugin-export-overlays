apiVersion: extensions.backstage.io/v1alpha1
kind: Package
metadata:
  name: backstage-community-plugin-jenkins
  namespace: rhdh
  title: "Jenkins Frontend"
  links:
    - url: https://red.ht/rhdh
      title: Homepage
    - url: https://github.com/backstage/community-plugins/issues
      title: Bugs
    - title: Source Code
      url: https://github.com/backstage/community-plugins/tree/main/workspaces/jenkins
  annotations:
    backstage.io/source-location: url:https://github.com/backstage/community-plugins/tree/main/workspaces/jenkins
  tags: []
spec:
  packageName: "@backstage-community/plugin-jenkins"
  dynamicArtifact: oci://quay.io/veecode/jenkins:bs_1.54.0-next.0!backstage-community-plugin-jenkins
  nfs:
    entrypoint: ./alpha
    exposedModules:
      - .
      - alpha
    composition:
      route: /catalog/default/component/probe-jenkins
      featureId: jenkins.latest-run
      probe:
        kind: Component
        annotations:
          jenkins.io/job-full-name: __nfs_annotation_present__
          jenkins.io/github-folder: __nfs_annotation_present__
      provenance:
        sources:
          - path: workspaces/jenkins/plugins/jenkins/src/alpha.ts
            lines: 28-34
          - path: workspaces/jenkins/plugins/jenkins/src/alpha/entityCards.tsx
            lines: 22-40
          - path: workspaces/jenkins/plugins/jenkins/src/components/Cards/Cards.tsx
            lines: 1-131
          - path: workspaces/jenkins/plugins/jenkins/src/components/Cards/Cards.tsx
            lines: 104-104
          - path: workspaces/jenkins/plugins/jenkins/src/components/Router.tsx
            lines: 32-34
          - path: workspaces/jenkins/plugins/jenkins/src/constants.ts
            lines: 16-16
          - path: workspaces/jenkins/plugins/jenkins/src/constants.ts
            lines: 19-19
          - path: workspaces/jenkins/plugins/jenkins/src/alpha/entityContent.tsx
            lines: 27-37
          - path: workspaces/jenkins/plugins/jenkins/src/components/Router.tsx
            lines: 1-55
          - path: workspaces/jenkins/plugins/jenkins/src/components/BuildWithStepsPage/BuildWithStepsPage.tsx
            lines: 57-57
        siblingPackages:
          - type: workspace-package
            packageName: '@backstage-community/plugin-jenkins-common'
            packageRoot: /home/gio/drydock-rescue/author-source-cache/ff4647976b36048191d5/workspaces/jenkins/plugins/jenkins-common
            subpath: .
            entrypoint: src/index.ts
        annotationDecisions:
          - jenkins.io/job-full-name: assertion
            jenkins.io/github-folder: assertion
          - jenkins.io/job-full-name: assertion
            jenkins.io/github-folder: assertion
        unregisteredBlueprints:
          - type: EntityCardBlueprint
            name: job-runs
            status: out-of-plugin
            registration: not-registered
            source:
              path: workspaces/jenkins/plugins/jenkins/src/alpha/entityCards.tsx
              lines: 46-53
      assertions:
        - type: text
          value: Latest master build
          proofLevel: mount
      secondary:
        name: projects
        featureId: jenkins.projects
        probe:
          kind: Component
          annotations:
            jenkins.io/job-full-name: __nfs_annotation_present__
            jenkins.io/github-folder: __nfs_annotation_present__
        assertions:
          - type: text
            value: Projects
            proofLevel: content
        provenance:
          sources:
            - path: workspaces/jenkins/plugins/jenkins/src/alpha/entityContent.tsx
              lines: 27-37
            - path: workspaces/jenkins/plugins/jenkins/src/components/Router.tsx
              lines: 1-55
            - path: workspaces/jenkins/plugins/jenkins/src/components/BuildWithStepsPage/BuildWithStepsPage.tsx
              lines: 57-57
            - path: workspaces/jenkins/plugins/jenkins/src/components/Router.tsx
              lines: 32-34
            - path: workspaces/jenkins/plugins/jenkins/src/constants.ts
              lines: 16-16
            - path: workspaces/jenkins/plugins/jenkins/src/constants.ts
              lines: 19-19
        surfacePath: jenkins
  version: 0.30.0
  backstage:
    role: frontend-plugin
    supportedVersions: 1.49.4
  author: Red Hat
  support: community
  lifecycle: active
  partOf:
    - jenkins
  appConfigExamples:
    - title: Default configuration
      content:
        dynamicPlugins:
          frontend:
            backstage-community.plugin-jenkins:
              mountPoints:
                - mountPoint: entity.page.ci/cards
                  importName: EntityJenkinsContent
                  config:
                    layout:
                      gridColumn: 1 / -1
                    if:
                      allOf:
                        - isJenkinsAvailable
