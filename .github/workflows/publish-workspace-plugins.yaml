name: Publish DevPortal Dynamic Plugin Images
on:
  workflow_dispatch:
    inputs:
      rc-tag-suffix:
        description: "RC suffix for the bundle tag, e.g. -rc.abc1234 (empty = publish the release tag, as the main path does)"
        type: string
        default: ''
        required: false
  push:
    branches:
      - 'main'
    paths:
      - 'workspaces/**'
      - 'catalog-entities/**'
      - 'versions.json'

jobs:
  export:
    uses: veecode-platform/devportal-plugin-export-overlays/.github/workflows/publish-release-branch-workspace-plugins.yaml@main
    # Dispatching this workflow against a bump branch with an rc-tag-suffix is how
    # a release candidate reaches Quay without merging first. `inputs` is null on
    # the push path, so the fallback keeps the main publish byte-identical.
    with:
      rc-tag-suffix: ${{ inputs.rc-tag-suffix || '' }}
    secrets:
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
      QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write

  dispatch-docs-update:
    needs: export
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Trigger plugin catalog update in docs
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: veecode-platform/docs
          event-type: plugin-catalog-update
