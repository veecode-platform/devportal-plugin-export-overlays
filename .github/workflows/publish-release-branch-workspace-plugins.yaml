name: Publish RHDH Release Dynamic Plugin Images 
on:
  workflow_call:
    inputs:
      workspace-path:
        description: >-
          Limit the export to a single workspace (e.g. 'workspaces/veecode-theme').
          Empty exports the whole fleet, which is the only correct default for a real
          publish. A one-workspace run exists to make an RC dispatch cheap enough to
          test: a full fleet export is 71 workspaces.
        type: string
        default: ''
        required: false

      rc-tag-suffix:
        description: >-
          Release-candidate suffix for the bundle tag, e.g. '-rc.abc1234'. When set,
          compatible workspaces publish bs_<version><suffix> instead of bs_<version>,
          so a bump run can prove the fleet from its own branch BEFORE anything merges
          — which is the whole reason the Drydock phase machine existed (ADR-0009).
          The suffix is applied inside the compatibility check, so incompatible
          workspaces still fall back to next__ and never claim a version they lack.
        type: string
        default: ''
        required: false
    secrets:
      QUAY_TOKEN:
        description: Quay.io robot account token for pushing OCI images
        required: true
      QUAY_API_TOKEN:
        description: Quay.io OAuth token for API operations (setting repo visibility)
        required: false

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    name: Prepare
    outputs:
      last-published-commit: ${{ steps.get-last-published-commit.outputs.last-published-commit }}

    steps:
      # A RELEASE CANDIDATE always publishes the whole fleet.
      #
      # Skipping unchanged workspaces is an optimisation for the main branch, where
      # the bundle tag is stable (`bs_<version>`) and a workspace that did not change
      # already has its bundle under that tag. A candidate tag is derived from the
      # COMMIT (`bs_<version>-rc.<sha>`), so it is a brand-new tag every time — and a
      # skipped workspace simply has no bundle under it.
      #
      # Drydock resolves every declared fleet member at one tag and hashes the set, so
      # a partial candidate is not a smaller candidate: it is an unresolvable one. The
      # 1.54.0-next.0 run hit this the moment its branch gained a second commit —
      # `bs_…-rc.15a69df` held 44 workspaces, `bs_…-rc.7a599c5a` held 1, and the run
      # blocked on PUBLISH_FAILED with the publish workflow green. Every repair round
      # would do the same, because repair moves HEAD by design.
      #
      # Forcing it here rather than adding an input: there is no case where a
      # candidate wants a partial fleet, so leaving it to the caller only leaves room
      # to get it wrong.
      - name: Get last published commit
        id: get-last-published-commit
        if: inputs.rc-tag-suffix == ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_RELEASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            core.info(`Getting latest commit on branch ${core.getInput('release_branch')}`);

            const currentRun = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const workflowId = currentRun.data.workflow_id;

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              branch: core.getInput('release_branch'),
              status: 'success',
              per_page: 10,
              exclude_pull_requests: true,
            });

            for (const run of runs.data.workflow_runs) {
              if ((context.payload.commits ?? []).some(c => c.id === run.head_sha)) {
                core.info(`Skipping run ${run.id} for commit ${run.head_sha}, it's part of the push`);
                continue;
              }

              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                filter: 'latest',
              });

              const exportJobs = jobs.data.jobs.filter(j => j.name.startsWith('export /'));
              if (exportJobs.length > 0 && exportJobs.every(j => j.conclusion === 'success')) {
                core.info(`Last published commit to compare with: ${run.head_sha}`);
                core.setOutput('last-published-commit', run.head_sha);
                return;
              }
              core.info(`Skipping run ${run.id} for commit ${run.head_sha}: export jobs not all successful`);
            }

            core.info('Last published commit not found');
            core.setOutput('last-published-commit', '');
            
  export:
    uses: veecode-platform/devportal-plugin-export-utils/.github/workflows/export-workspaces-as-dynamic.yaml@main
    needs:
      - prepare

    with:
      publish-container: true
      image-repository-prefix: quay.io/veecode
      last-publish-commit: ${{ needs.prepare.outputs.last-published-commit }}
      # Empty prefix means "let export-utils compute bs_1.yy.z__ per workspace,
      # gated on compatibility". Never hardcode a prefix here: it overrides that
      # computation for EVERY workspace, so an incompatible one would publish a
      # bs_ tag asserting support it does not have. RC tags go through
      # rc-tag-suffix, which is applied inside the gate instead of replacing it.
      image-tag-prefix: ${{ '' }}
      rc-tag-suffix: ${{ inputs.rc-tag-suffix }}
      workspace-path: ${{ inputs.workspace-path }}
      image-registry-user: veecode+ci
      bundle-workspace: true

    secrets:
      image-registry-password: ${{ secrets.QUAY_TOKEN }}
      quay-api-token: ${{ secrets.QUAY_API_TOKEN }}

    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write

  publish-catalog-index:
    # Runs on a candidate pass too, under the CANDIDATE tag.
    #
    # It used to be skipped outright, and the reason recorded here was the tag, not
    # the artifact: this job derived its name from versions.json alone, so on a
    # candidate branch it pushed the RELEASE tag `bs_<version>` — the very tag the
    # Factory's final gate checks for coherence. It did exactly that from a throwaway
    # branch during the first RC dispatch (2026-07-27).
    #
    # Skipping was the wrong cure for that. A platform image bakes
    # `plugin-catalog-index:bs_<version>` at build time and the fetch is build-fatal,
    # so with no candidate index the first image on any new Backstage version could
    # not be built at all — and that image is what the run verifies against. The
    # 1.54.0-next.0 run hit it: `plugin-catalog-index:bs_1.54.0-next.0` had zero tags.
    #
    # Honouring `rc-tag-suffix` fixes the tag without giving up the artifact, exactly
    # as the bundle export already does. `bs_<version>` stays untouched until a real
    # release publishes it, and a candidate index is coherent by construction: it is
    # assembled from `catalog-entities/` at the very commit under test.
    runs-on: ubuntu-latest
    name: Publish Catalog Index
    needs:
      - export

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read backstage version from versions.json
        id: versions
        run: |
          BS_VERSION=$(jq -r '.backstage' versions.json)
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%S)
          echo "backstage=$BS_VERSION" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Assemble catalog index
        run: bash scripts/assemble-catalog-index.sh

      - name: Validate catalog index
        run: |
          YAML_COUNT=$(find catalog-entities/extensions -name '*.yaml' | wc -l)
          echo "Found $YAML_COUNT YAML files"
          if [ "$YAML_COUNT" -lt 50 ]; then
            echo "ERROR: expected at least 50 YAML files, got $YAML_COUNT"
            exit 1
          fi

          # dynamic-plugins.default.yaml (Option D step 1): the generator
          # must have replaced the committed stub with a real, digest-pinned
          # index in the working tree.
          DPDY=catalog-entities/dynamic-plugins.default.yaml
          if [ ! -f "$DPDY" ]; then
            echo "ERROR: $DPDY is missing"
            exit 1
          fi

          PACKAGE_COUNT=$(grep -c '^\s*- package:' "$DPDY" || true)
          echo "Found $PACKAGE_COUNT package entries in $DPDY"
          if [ "$PACKAGE_COUNT" -lt 1 ]; then
            echo "ERROR: expected at least 1 '- package:' entry in $DPDY, got $PACKAGE_COUNT"
            exit 1
          fi

          BAD_REFS=$(grep '^\s*- package:' "$DPDY" | grep -vcE 'oci://[^"[:space:]]+@sha256:[0-9a-f]{64}!' || true)
          if [ "$BAD_REFS" -ne 0 ]; then
            echo "ERROR: $BAD_REFS package entries are not digest-pinned oci refs (expected oci://<image>@sha256:<64 hex>!<selector>)"
            grep '^\s*- package:' "$DPDY" | grep -vE 'oci://[^"[:space:]]+@sha256:[0-9a-f]{64}!' || true
            exit 1
          fi

          DISABLED_COUNT=$(grep -c '^\s*disabled: true\s*$' "$DPDY" || true)
          echo "Found $DISABLED_COUNT 'disabled: true' entries"
          if [ "$DISABLED_COUNT" -ne "$PACKAGE_COUNT" ]; then
            echo "ERROR: disabled:true count ($DISABLED_COUNT) does not match package count ($PACKAGE_COUNT)"
            exit 1
          fi

      - name: Build OCI image
        run: |
          cd catalog-entities
          podman build -t plugin-catalog-index -f Containerfile .

      - name: Push to Quay.io
        env:
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          BS_VERSION: ${{ steps.versions.outputs.backstage }}
          TIMESTAMP: ${{ steps.versions.outputs.timestamp }}
          RC_TAG_SUFFIX: ${{ inputs.rc-tag-suffix }}
        # Versioned tags ONLY. The mutable `:latest` tag is a production
        # pointer consumed by deployed instances; it is promoted exclusively
        # by the human-approved promote-catalog-index-latest.yaml workflow.
        # Never re-add it here — an automatic retag from a branch whose
        # versions.json has moved would repoint every :latest consumer at an
        # unvalidated line (see CLAUDE.md § "Publish vs. promote").
        run: |
          podman login -u veecode+ci -p "$QUAY_TOKEN" quay.io
          IMAGE="quay.io/veecode/plugin-catalog-index"

          # A candidate pass publishes ONE tag: bs_<version>-rc.<sha>.
          #
          # It must never write `bs_<version>` — that is the tag the Factory's final
          # gate checks for coherence, and moving it before anything is accepted is the
          # mistake that got this whole job disabled for candidates.
          #
          # No timestamped companion either. The timestamp exists to keep an audit
          # trail of successive publishes under one mutable release tag; a candidate tag
          # already names its exact commit, so a second copy would only be garbage with
          # a 14-day expiry.
          if [ -n "${RC_TAG_SUFFIX}" ]; then
            RC_TAG="bs_${BS_VERSION}${RC_TAG_SUFFIX}"
            podman tag plugin-catalog-index "$IMAGE:${RC_TAG}"
            podman push "$IMAGE:${RC_TAG}"
            echo "Published $IMAGE:${RC_TAG} (candidate — bs_${BS_VERSION} untouched)"
            exit 0
          fi

          podman tag plugin-catalog-index "$IMAGE:bs_${BS_VERSION}"
          podman tag plugin-catalog-index "$IMAGE:bs_${BS_VERSION}_${TIMESTAMP}"
          podman push "$IMAGE:bs_${BS_VERSION}"
          podman push "$IMAGE:bs_${BS_VERSION}_${TIMESTAMP}"
          echo "Published $IMAGE with tags: bs_${BS_VERSION}, bs_${BS_VERSION}_${TIMESTAMP} (:latest is promotion-only)"

      - name: Set Quay repository to public
        env:
          QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
        run: |
          if [ -z "$QUAY_API_TOKEN" ]; then
            echo "QUAY_API_TOKEN not set, skipping visibility change"
            exit 0
          fi
          curl -s -X PUT \
            -H "Authorization: Bearer $QUAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"public"}' \
            "https://quay.io/api/v1/repository/veecode/plugin-catalog-index/changevisibility" || true
