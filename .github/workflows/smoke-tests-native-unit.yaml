name: Smoke tests native unit

on:
  pull_request:
    paths:
      - 'smoke-tests-native/**'
      - '.github/workflows/smoke-tests-native-unit.yaml'
  workflow_dispatch:

concurrency:
  group: smoke-tests-native-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Native smoke harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable Corepack
        # Before setup-node so its yarn-cache detection resolves Yarn 4 via corepack.
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: smoke-tests-native/yarn.lock

      - name: Install dependencies
        working-directory: smoke-tests-native
        run: yarn install --immutable --mode=skip-build

      - name: Run unit tests
        working-directory: smoke-tests-native
        run: yarn test
