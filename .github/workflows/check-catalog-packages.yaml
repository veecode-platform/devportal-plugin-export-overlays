name: Check catalog packages

# Resolves the spec.dynamicArtifact of every package in an enabled workspace and validates
# each Package entity against the portal's schema. A workspace is enabled when it has a
# plugins-list.yaml (parked workspaces keep plugins-list.yaml.disabled).
#
# Keep the pull_request trigger unfiltered so this required check always reports. The
# first job filters package-check paths inside the run and skips the check for other PRs.
# Sync pull requests opened with the Actions token still need workflow_dispatch because
# that token does not start pull_request runs; the sync workflow dispatches on each branch.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA whose packages are checked. Empty checks the ref the workflow runs on.
        type: string
        required: false
        default: ""

concurrency:
  group: check-catalog-packages-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect_package_check_paths:
    name: Detect package check paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_check: ${{ steps.detect.outputs.should_check }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect package check paths
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_check=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_paths_file="${RUNNER_TEMP}/changed-paths"
          git diff --name-only -z --merge-base "${BASE_SHA}" "${HEAD_SHA}" > "${changed_paths_file}"

          should_check=false
          while IFS= read -r -d '' path; do
            if [[ "${path}" =~ ^workspaces/[^/]+/metadata/ ]] ||
              [[ "${path}" =~ ^workspaces/[^/]+/plugins-list[.]yaml[^/]*$ ]] ||
              [[ "${path}" =~ ^catalog-entities/ ]] ||
              [[ "${path}" == "scripts/checkCatalogPackages.py" ]] ||
              [[ "${path}" =~ ^scripts/schemas/ ]] ||
              [[ "${path}" == "scripts/requirements.txt" ]] ||
              [[ "${path}" == ".github/workflows/check-catalog-packages.yaml" ]]; then
              should_check=true
            fi
          done < "${changed_paths_file}"

          echo "should_check=${should_check}" >> "${GITHUB_OUTPUT}"

  check-catalog-packages:
    name: check-catalog-packages
    needs: detect_package_check_paths
    if: >-
      always() &&
      (needs.detect_package_check_paths.result != 'success' ||
       needs.detect_package_check_paths.outputs.should_check == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A sync branch can predate this workflow, so the packages come from `ref` and the
      # check itself always comes from the ref the workflow runs on.
      - name: Checkout the packages to check
        if: inputs.ref != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          path: target
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }

      - name: Check the packages of enabled workspaces
        shell: bash
        env:
          PACKAGES_ROOT: ${{ inputs.ref != '' && 'target' || '.' }}
        run: |
          shopt -s nullglob
          files=()
          for dir in "${PACKAGES_ROOT}"/workspaces/*/; do
            if [[ -f "${dir}plugins-list.yaml" ]]; then
              files+=("${dir}"metadata/*.yaml)
            fi
          done
          echo "Checking ${#files[@]} package files of enabled workspaces"
          python3 scripts/checkCatalogPackages.py "${files[@]}"
